<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <title>雪中明月 の 主页</title>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="img/favicon.png">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" crossorigin="anonymous"
        href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Medium.min.css" />
    <link rel="stylesheet" crossorigin="anonymous"
        href="https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Bold.min.css" />
    <link rel="stylesheet" href="css/mobile.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="雪中明月 の 个人主页">
    <meta name="theme-color" content="#28abf5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="img/AppImages/ios/180.png">
</head>

<body>
    <div id="background">
        <div id="background_img"></div>
    </div>
    <div id="background_shadow"></div>
    <div id="content">
        <div id="inside_content">
            <div id="left">
                <div id="website_title" onclick="show_toast('点它是没有用的')">
                    <span id="donmin"></span>
                    <span id="suffix"></span>
                </div>
                <div id="scentence" onclick="show_toast('呼噜呼噜呵')">
                    <div></div>
                    <div></div>
                </div>
                <div id="contact_me">
                    <span class="material-icons contact_ico">email</span>
                    <span class="material-icons contact_ico">forum</span>
                    <span class="material-icons contact_ico">chat_bubble</span>
                    <span class="material-icons contact_ico">send</span>
                </div>
                    <div id="expand1" class="expand" onclick="expand_toggle()">
                    <span class="material-icons expand_icon">chevron_right</span>
                </div>
            </div>
            <div id="right">
                <div id="box_top">
                    <div id="lrc_box" onclick="change_onelrc()">
                        <div id="lrc">努力加载中</div>
                        <div id="lrc_author">. . . . . .</div>
                    </div>
                    <div id="time_box" onclick="show_toast('时钟滴答滴答的声音你听懂了吗',1)">00:00:00</div>
                </div>
                <div id="box_centre">
                    <span class="material-icons" id="box_centre_icon">star</span>常用网址导航
                </div>
                <div id="box_bottom">
                    <div id="group1" class="link_group">
                        <div class="link_box"></div>
                        <div class="link_box"></div>
                        <div class="link_box"></div>
                    </div>
                    <div id="group2" class="link_group">
                        <div class="link_box"></div>
                        <div class="link_box"></div>
                        <div class="link_box"></div>
                    </div>
                    <div id="expand2" class="expand" onclick="expand_toggle()">
                        <span class="material-icons expand_icon">chevron_left</span>
                    </div>
                </div>
            </div>
        </div>
        <div id="buttom_bar" class="loading">
            <span class="loading-spinner"></span> loading ...
        </div>
    </div>
    <!-- setting -->
    <script src="js/config.js"></script>
    <!-- toast -->
    <script src="js/toast.js"></script>
    <!-- 特效光标 -->
    <script src="js/cursor2.js"></script>
    <!-- 原神开场动画 -->
    <script src="js/beginning.js"></script>
    <script src="js/myjs.js"></script>
    <!-- PWA -->
    <script type="text/javascript">
        if (navigator.serviceWorker != null) { navigator.serviceWorker.register('js/sw.js') }
    </script>
</body>

</html>
